<script>
const ICONS = "assets/icons/";
const LOGOS = "assets/logos/";
const SOURCES = [
  "components/core/Button.jsx",
  "components/core/Icon.jsx",
  "components/core/Badge.jsx",
  "components/core/Card.jsx",
  "components/core/Avatar.jsx",
  "ui_kits/landing_clone/parts/Nav.jsx",
  "ui_kits/landing_clone/parts/Header.jsx",
  "ui_kits/landing_clone/parts/Features.jsx",
  "ui_kits/landing_clone/parts/Social.jsx",
  "ui_kits/landing_clone/parts/Industries.jsx",
  "ui_kits/landing_clone/parts/Closing.jsx",
];

(async () => {
  const NS = {};
  let combined = "var ICONS=" + JSON.stringify(ICONS) + ";\nvar LOGOS=" + JSON.stringify(LOGOS) + ";\n";
  const names = [];
  for (const f of SOURCES) {
    let src = await (await fetch(f)).text();
    src = src.replace(/^\s*import\s+.*?;?\s*$/gm, "");
    src = src.replace(/export\s+function\s+(\w+)/g, (m, n) => { names.push(n); return "function " + n; });
    combined += "\n" + src + "\n";
  }
  combined += "\nObject.assign(NS, {" + names.join(",") + "});";
  new Function("React", "NS", Babel.transform(combined, { presets: ["react"] }).code)(window.React, NS);

  const { Header, Features, Stories, SwitchProvider, Industries, Integrations, GetStarted, FinalCta, Footer } = NS;
  const e = React.createElement;
  function Page() {
    return e(React.Fragment, null,
      e(Header), e(Features), e(Stories), e(SwitchProvider),
      e(Industries), e(Integrations), e(GetStarted), e(FinalCta), e(Footer)
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(e(Page));
})().catch((err) => {
  console.error("[TodoPymes] No se pudo cargar la interfaz:", err);
});
</script>
